name: Build Fladder

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    paths:
      - pubspec.yaml
      - .github/workflows/build.yml
      - .fvmrc
    types:
      - opened
      - reopened
  schedule:
    # Run nightly at midnight UTC, but only if there were changes to develop
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  # Check if workflow should run based on trigger conditions
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Check if should run and determine build type
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            git checkout develop
            COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
            if [[ $COMMITS_LAST_24H -gt 0 ]]; then
              BUILD_TYPE="nightly"
            else
              echo "No commits to develop in the last 24 hours, skipping nightly build"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            BUILD_TYPE="development"
          fi
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Fetch version name and create nightly version
        id: fetch
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"
          
          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  build-linux-arm64:
    needs: [fetch-info]
    # Note: Default hosted runners are x86_64. Update this tag if utilizing your own ARM64 host.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git xz-utils zip unzip libglu1-mesa
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6
          sudo apt-get install -y libasound2-dev
          # Fixed: Added native video player dependencies for media_kit_video
          sudo apt-get install -y libmpv-dev mpv

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Compile Linux App
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "development" ]]; then
            flutter build linux --debug
          else
            flutter build linux --release
          fi

      - name: Organize Artifacts
        run: |
          mkdir -p build/linux/artifacts
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "development" ]]; then
            cp -r build/linux/x64/debug/bundle/* build/linux/artifacts/ || cp -r build/linux/arm64/debug/bundle/* build/linux/artifacts/ || true
          else
            cp -r build/linux/x64/release/bundle/* build/linux/artifacts/ || cp -r build/linux/arm64/release/bundle/* build/linux/artifacts/ || true
          fi

      - name: Archive Linux Artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: fladder-linux-${{ needs.fetch-info.outputs.build_type }}
          path: build/linux/artifacts/
