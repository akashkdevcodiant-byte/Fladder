name: Build Web App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your project repository code into the runner environment
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the correct Flutter SDK environment (replaces setup-dart)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 3: Securely fetch project dependencies using the Flutter toolchain
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Run static code analysis to check for issues
      - name: Analyze project source
        run: flutter analyze

      # Step 5: Execute unit and widget tests
      - name: Run tests
        run: flutter test

      # Step 6: Compile the web production application assets
      - name: Build Web Application
        run: flutter build web
