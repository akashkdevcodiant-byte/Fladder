stages:
  - build

build_linux_arm64:
  stage: build
  # Target an ARM64 runner. For GitLab SaaS use 'saas-linux-small-arm64'. 
  # For self-hosted runners, use your custom assigned ARM64 tag.
  tags:
    - saas-linux-small-arm64
  image: ubuntu:22.04
  before_script:
    # 1. Install necessary Linux desktop dependencies for Flutter
    - apt-get update -y
    - apt-get install -y curl git xz-utils zip unzip libglu1-mesa
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6
    
    # 2. Clone the Flutter SDK dynamically
    - git clone https://github.com/flutter/flutter.git -b stable /opt/flutter
    - export PATH="$PATH:/opt/flutter/bin"

    # 3. Verify the installation environment
    - flutter doctor -v
  script:
    # 4. Enable Linux desktop support inside the environment
    - flutter config --enable-linux-desktop
    
    # 5. Fetch dependencies and compile the ARM64 release binary
    - flutter pub get
    - flutter build linux --release
  artifacts:
    name: "flutter-linux-arm64-release"
    when: on_success
    paths:
      # Capture the generated ARM64 bundle assets
      - build/linux/arm64/release/bundle/
    expire_in: 1 week
