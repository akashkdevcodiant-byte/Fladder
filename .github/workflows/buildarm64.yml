name: Build Linux ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_linux_arm64:
    # Note: Default GitHub-hosted runners are x86_64.
    # To run on actual ARM64, you must use a self-hosted ARM64 runner tag here.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git xz-utils zip unzip libglu1-mesa
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6

      - name: Clone Flutter SDK
        run: |
          sudo git clone https://github.com/flutter/flutter.git -b stable /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Verify installation environment
        run: |
          export PATH="$PATH:/opt/flutter/bin"
          flutter doctor -v

      - name: Enable Linux desktop support
        run: |
          export PATH="$PATH:/opt/flutter/bin"
          flutter config --enable-linux-desktop

      - name: Fetch dependencies and compile
        run: |
          export PATH="$PATH:/opt/flutter/bin"
          flutter pub get
          flutter build linux --release

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-release
          path: build/linux/arm64/release/bundle/
          retention-days: 7 
